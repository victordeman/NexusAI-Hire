<html lang="en" class="dark">

    <script src="components/ModelSelector.js"></script>  <!-- make sure this is loaded -->
    <script src="components/sidebar.js"></script>        <!-- if used elsewhere -->
    <script src="script.js"></script>

    <script>
        feather.replace();

        // Model mapping for pretty badge
        const modelLabels = {
            "openai/gpt-4o-mini": "GPT-4o-mini",
            "openai/gpt-4o": "GPT-4o",
            "google/gemini-1.5-pro": "Gemini 1.5 Pro",
            "ollama/llama3": "Llama 3 (local)",
            "anthropic/claude-3.5-sonnet": "Claude 3.5 Sonnet"
        };

        // Update badge on load and when model changes
        function updateModelBadge() {
            const saved = localStorage.getItem('preferredModel');
            const label = modelLabels[saved] || "GPT-4o-mini";
            const badge = document.querySelector('.bg-primary-500\\/20.text-primary-300');
            if (badge) badge.textContent = label;
        }

        // Trust score elements
        const trustNumberEl = document.querySelector('.top-4.right-4 .text-2xl');
        const trustBarEl = document.querySelector('.top-4.right-4 .w-\\[94\\%\\]');

        function updateTrustScore(score) {
            if (trustNumberEl) trustNumberEl.textContent = score;
            if (trustBarEl) trustBarEl.style.width = `${score}%`;
        }

        // Initial UI setup
        updateModelBadge();
        document.addEventListener('model-changed', updateModelBadge);

        // Auto-resize textarea (unchanged)
        const textarea = document.getElementById('message-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 128) + 'px';
        });

        textarea.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, 'user');
            input.value = '';
            input.style.height = 'auto';

            // Show typing + send to backend
            showTypingIndicator();

            const currentModel = localStorage.getItem('preferredModel') || null;

            try {
                const response = await fetch('http://localhost:8000/api/v1/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: text,
                        model: currentModel
                    })
                });

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                
                removeTypingIndicator();
                addMessage(data.answer, 'ai');
                updateTrustScore(data.trust_score);

            } catch (err) {
                removeTypingIndicator();
                addMessage('Sorry, I could not reach the server. Is the backend running?', 'ai');
                console.error(err);
            }
        }

        // addMessage, showTypingIndicator, removeTypingIndicator — unchanged from your original

        function addMessage(text, sender) { /* your original function */ }
        function showTypingIndicator() { /* your original function */ }
        function removeTypingIndicator() { /* your original function */ }

        // ... rest of your original helper functions (clearChat, endInterview, etc.) ...
    </script>
</body>
</html>
