<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview - NexusAI Hire</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="auth.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81',
                        },
                        secondary: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chat-container { height: calc(100vh - 180px); }
        .message-ai { background: rgba(30, 41, 59, 0.7); border-bottom-left-radius: 4px; }
        .message-user { background: rgba(99, 102, 241, 0.2); border-bottom-right-radius: 4px; border: 1px solid rgba(99, 102, 241, 0.3); }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .typing-dot { width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; display: inline-block; animation: typing 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden">
    <script type="module" src="components/navbar.js"></script>
    <script type="module" src="components/sidebar.js"></script>
    <script type="module" src="components/model-selector.js"></script>
    <script type="module" src="components/trust-score.js"></script>

    <div class="flex h-screen overflow-hidden">
        <nexus-sidebar></nexus-sidebar>
        
        <div class="flex-1 flex flex-col overflow-hidden">
            <nexus-navbar></nexus-navbar>
            
            <main class="flex-1 flex flex-col p-4 md:p-6 bg-slate-950 overflow-hidden">
                <!-- Interview Header -->
                <div class="glass-panel rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <img src="https://static.photos/people/48x48/1" alt="Candidate" class="w-12 h-12 rounded-xl object-cover border-2 border-primary-500/20">
                            <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-2 border-slate-900 rounded-full"></div>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white leading-none mb-1">Sarah Chen</h2>
                            <p class="text-sm text-slate-400">Senior Frontend Engineer Candidate</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-6">
                        <div class="flex items-center gap-2 px-3 py-1.5 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-sm font-semibold animate-pulse">
                            <i data-feather="radio" class="w-4 h-4"></i>
                            <span>LIVE</span>
                        </div>
                        <div class="h-8 w-px bg-slate-800"></div>
                        <div class="flex flex-col items-end">
                            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Active Model</span>
                            <div class="flex items-center gap-2">
                                <span class="bg-primary-500/20 text-primary-300 px-2 py-0.5 rounded text-xs font-medium" id="model-badge">GPT-4o-mini</span>
                                <nexus-model-selector></nexus-model-selector>
                            </div>
                        </div>
                        <div class="h-8 w-px bg-slate-800"></div>
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Trust Score</span>
                            <nexus-trust-score id="main-trust-score" score="94"></nexus-trust-score>
                        </div>
                    </div>
                </div>

                <!-- Chat Area -->
                <div 
                    x-data="chatInterface()"
                    class="chat-container flex-1 flex flex-col glass-panel rounded-2xl overflow-hidden relative"
                >
                    <!-- Messages -->
                    <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="`flex gap-4 ${msg.sender === 'user' ? 'flex-row-reverse' : ''} max-w-3xl ${msg.sender === 'user' ? 'ml-auto' : ''} animate-fade-in`" >
                                <div :class="`w-8 h-8 rounded-lg ${msg.sender === 'ai' ? 'bg-primary-600' : 'bg-slate-700'} flex items-center justify-center flex-shrink-0`" x-html="getIcon(msg.sender)">
                                </div>
                                <div :class="`${msg.sender === 'ai' ? 'message-ai' : 'message-user'} p-4 rounded-2xl text-slate-200`" x-text="msg.text">
                                </div>
                            </div>
                        </template>
                        
                        <!-- Typing Indicator -->
                        <div x-show="isTyping" class="flex gap-4 max-w-3xl animate-fade-in">
                             <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center flex-shrink-0" x-html="getIcon('ai')">
                             </div>
                             <div class="message-ai p-4 rounded-2xl text-slate-200 flex items-center gap-1">
                                 <span class="typing-dot"></span>
                                 <span class="typing-dot"></span>
                                 <span class="typing-dot"></span>
                             </div>
                        </div>
                    </div>

                    <!-- Input Area -->
                    <div class="p-4 bg-slate-900/50 border-t border-slate-800">
                        <div class="max-w-4xl mx-auto relative">
                            <textarea 
                                x-model="userInput"
                                @keydown.enter.prevent="if(!$event.shiftKey) send()"
                                @input="autoResize($el)"
                                id="message-input"
                                rows="1"
                                placeholder="Type your response here..."
                                class="w-full bg-slate-800 border border-slate-700 rounded-xl py-4 pl-4 pr-32 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all resize-none overflow-hidden"
                            ></textarea>
                            <div class="absolute right-2 bottom-2 flex items-center gap-2">
                                <button 
                                    @click="toggleMic()" 
                                    :class="{'text-primary-500 animate-pulse': isListening, 'text-slate-400 hover:text-white': !isListening}"
                                    class="p-2 transition-colors" 
                                    title="Toggle Mic"
                                >
                                    <i data-feather="mic" class="w-5 h-5"></i>
                                </button>
                                <button 
                                    @click="send()"
                                    class="bg-primary-600 hover:bg-primary-500 text-white px-4 py-2 rounded-lg font-semibold transition-all flex items-center gap-2 shadow-lg shadow-primary-600/20"
                                >
                                    <span>Send</span>
                                    <i data-feather="send" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                        <div class="max-w-4xl mx-auto mt-2 flex justify-between items-center px-2">
                            <p class="text-[10px] text-slate-500">Press Enter to send, Shift + Enter for new line</p>
                            <div class="flex gap-4">
                                <button @click="clear()" class="text-[10px] text-slate-500 hover:text-red-400 transition-colors uppercase tracking-widest font-bold">Clear Chat</button>
                                <button @click="endInterview()" class="text-[10px] text-slate-500 hover:text-white transition-colors uppercase tracking-widest font-bold">End Interview</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="interview.js"></script>
</body>
</html>
