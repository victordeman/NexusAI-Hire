<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration - NexusAI Hire</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="script.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81',
                        },
                        secondary: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col">
    <nexus-navbar></nexus-navbar>

    <main class="flex-1 flex items-center justify-center py-12 px-6">
        <div class="glass-panel max-w-2xl w-full p-8 rounded-3xl border-slate-800 shadow-2xl">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-bold text-white mb-2">Employee Registration</h1>
                <p class="text-slate-400">Join the NexusAI platform and start your journey.</p>
            </div>

            <form id="registration-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">First Name</label>
                        <input type="text" id="first_name" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">Last Name</label>
                        <input type="text" id="last_name" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Home Address</label>
                    <textarea id="home_address" required rows="2" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">Date of Birth</label>
                        <input type="date" id="date_of_birth" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300">Department</label>
                        <select id="department" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-primary-500 transition-all">
                            <option value="" disabled selected>Select Department</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Product">Product</option>
                            <option value="Design">Design</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Job Designation</label>
                    <input type="text" id="job_designation" required placeholder="e.g. Senior Software Engineer" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 transition-all">
                </div>

                <div class="flex items-center gap-3 p-4 bg-primary-500/5 border border-primary-500/10 rounded-xl">
                    <input type="checkbox" id="is_admin" class="w-5 h-5 rounded border-slate-700 bg-slate-800 text-primary-600 focus:ring-primary-500 focus:ring-offset-slate-900 transition-all">
                    <label for="is_admin" class="text-sm font-medium text-slate-300 cursor-pointer">Register as Administrator</label>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 bg-primary-600 hover:bg-primary-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-primary-600/20 flex items-center justify-center gap-2">
                    <span>Complete Registration</span>
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-slate-500">
                Already have an account? <a href="index.html" class="text-primary-400 hover:underline">Sign in</a>
            </p>
        </div>
    </main>

    <nexus-footer></nexus-footer>

    <script type="module" src="components/navbar.js"></script>
    <script type="module" src="components/footer.js"></script>
    <script type="module">
        document.getElementById('registration-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span>Processing...</span>';

            const formData = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                home_address: document.getElementById('home_address').value,
                date_of_birth: document.getElementById('date_of_birth').value,
                department: document.getElementById('department').value,
                job_designation: document.getElementById('job_designation').value,
                is_admin: document.getElementById('is_admin').checked
            };

            try {
                // 1. Sign up via Supabase Auth
                const { data: authData, error: authError } = await NexusAI.Auth.signUp(formData.email, formData.password);

                if (authError) throw authError;

                if (!authData.user) {
                    alert('Signup successful. Please check your email for confirmation before logging in.');
                    window.location.href = 'index.html';
                    return;
                }

                // 2. Wait for session if auto-logged in or sign in
                const { data: signInData, error: signInError } = await NexusAI.Auth.signIn(formData.email, formData.password);
                if (signInError) throw signInError;

                // 3. Save profile data to backend
                const response = await fetch('/api/v1/profile/me', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${NexusAI.Auth.getToken()}`
                    },
                    body: JSON.stringify({
                        first_name: formData.first_name,
                        last_name: formData.last_name,
                        email: formData.email,
                        home_address: formData.home_address,
                        date_of_birth: formData.date_of_birth,
                        department: formData.department,
                        job_designation: formData.job_designation,
                        is_admin: formData.is_admin
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to save profile');
                }

                alert('Registration successful!');
                window.location.href = formData.is_admin ? 'dashboard.html' : 'index.html';
            } catch (err) {
                alert('Error: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<span>Complete Registration</span>';
            }
        });
    </script>
</body>
</html>
